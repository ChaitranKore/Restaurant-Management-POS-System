<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Browse the menu, order in a couple of taps, and watch your order move through the kitchen in real time."
    />
    <title>TableSide — Order Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Fraunces:opsz,wght@9..144,500..700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Applied before first paint so a dark-mode user never sees a white flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tableside-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode / storage blocked — light mode is a fine default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
