# Render blueprint for the API.
#
# The Express server is deployed as a long-running web service rather than a
# serverless function: Socket.IO needs a persistent connection, and serverless
# platforms terminate idle ones. Both React clients deploy separately to Vercel
# (see client-*/vercel.json); only the API lives here.
#
# After the first deploy, set these in the Render dashboard:
#   MONGO_URI       your MongoDB Atlas connection string
#   CLIENT_ORIGINS  the two Vercel URLs, comma-separated, no trailing slashes
#
# Note: on Render's free tier the service sleeps after ~15 minutes idle and the
# next request pays a cold start of roughly a minute. For a link on a CV that is
# the difference between a recruiter waiting and a recruiter leaving — either use
# a paid instance or keep it warm with an external uptime pinger against /api/health.
services:
  - type: web
    name: tableside-api
    runtime: node
    plan: free
    # Match the database's region (the Atlas cluster is in AWS Mumbai).
    # Singapore is the nearest free-tier option; a US region adds roughly
    # 200ms of round-trip to every query. A service's region is fixed at
    # creation — changing it later means recreating the service.
    region: singapore
    rootDir: server
    buildCommand: npm ci
    # `setup` builds the indexes and seeds categories, menu, tables and the
    # default admin — it is idempotent, so running it on every boot is safe.
    # Without it the service starts against a completely empty Atlas database:
    # no menu, no tables, and the demo seeder refuses to run.
    startCommand: npm run setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      # PORT is deliberately not set — Render injects it, and the server reads
      # process.env.PORT. Hardcoding it here would override what Render expects
      # the service to be listening on.
      - key: JWT_EXPIRES_IN
        value: 7d
      # Generated once by Render and kept stable across deploys, so existing
      # tokens are not invalidated every time the service redeploys.
      - key: JWT_SECRET
        generateValue: true
      # Set these two by hand — they are environment-specific.
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGINS
        sync: false

  # Reseeds the demo hourly. The live kitchen tickets are seeded at fixed ages,
  # so without this they keep ageing: a visitor arriving three hours after a
  # deploy finds a board where every ticket is red and the "today" charts have
  # rolled into yesterday. It also undoes anything a visitor changed.
  - type: cron
    name: tableside-demo-reset
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    schedule: '0 * * * *'
    buildCommand: npm ci
    startCommand: npm run seed:demo
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: MONGO_URI
        sync: false
