server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset filename, so a given file's contents can
    # never change. Cache them hard — a redeploy produces new names.
    location /assets/ {
        # `expires` would emit a second, competing Cache-Control header, so set
        # the one header directly. A year is the max any client should honour.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        # A missing bundle must 404 rather than fall through to the app shell —
        # otherwise a stale index.html gets HTML served as JavaScript and the
        # failure surfaces as a confusing syntax error instead of a 404.
        try_files $uri =404;
    }

    # index.html must NOT be cached: it's the only file whose name is stable,
    # and it's what points at the fingerprinted bundles. Cached, a browser
    # keeps loading the previous deploy's asset names indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: the server owns no route but /assets, so anything
    # else has to fall through to the app shell. Without this, refreshing on
    # /checkout or sharing a link to /orders/:id returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
