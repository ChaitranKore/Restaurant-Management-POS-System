version: '3.8'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/restaurant_pos
      JWT_SECRET: ${JWT_SECRET:-please_change_me_in_prod}
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGINS: http://localhost:5173,http://localhost:5174
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Restaurant Admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@restaurant.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin@123}
    ports:
      - '5000:5000'

  client-customer:
    build:
      context: ./client-customer
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5173:80'

  client-admin:
    build:
      context: ./client-admin
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '5174:80'

volumes:
  mongo_data:
